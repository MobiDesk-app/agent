<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Phone simulator (manual test only)</title>
    <style>
      body { font-family: sans-serif; padding: 16px; background:#111; color:#eee; }
      video { width: 480px; border: 2px solid #4caf50; background:#000; }
      #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; background:#000; padding:8px; height:200px; overflow:auto; }
    </style>
  </head>
  <body>
    <h2>Phone simulator — manual pipeline test</h2>
    <button id="connect">Connect</button>
    <button id="move-tl">Move cursor: top-left (10%,10%)</button>
    <button id="move-br">Move cursor: bottom-right (90%,90%)</button>
    <p>Video stream from Electron agent's screen capture:</p>
    <video id="remote" autoplay playsinline></video>
    <div id="log"></div>
    <script>
      const logEl = document.getElementById("log");
      function log(...args) {
        logEl.textContent += args.join(" ") + "\n";
        logEl.scrollTop = logEl.scrollHeight;
        console.log(...args);
      }

      // Sign in via POST /api/auth/login and paste the returned token, plus
      // your linked PC's id (from GET /api/pcs), here.
      const SESSION_TOKEN = "paste-session-token-here";
      const TARGET = "paste-pc-id-here";
      let pc;
      let inputChannel;

      function sendInputEvent(event) {
        if (!inputChannel || inputChannel.readyState !== "open") {
          return log("input channel not open yet");
        }
        inputChannel.send(JSON.stringify(event));
        log("sent input event:", JSON.stringify(event));
      }

      document.getElementById("move-tl").addEventListener("click", () => {
        sendInputEvent({ type: "mousemove", xRatio: 0.1, yRatio: 0.1 });
      });
      document.getElementById("move-br").addEventListener("click", () => {
        sendInputEvent({ type: "mousemove", xRatio: 0.9, yRatio: 0.9 });
      });

      document.getElementById("connect").addEventListener("click", async () => {
        const ws = new WebSocket("ws://localhost:8080");

        ws.onopen = () => {
          log("ws open, authenticating as phone-sim");
          ws.send(JSON.stringify({ type: "auth", role: "app", sessionToken: SESSION_TOKEN }));
        };

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);
          log("recv:", msg.type, JSON.stringify(msg).slice(0, 200));

          if (msg.type === "auth_ok") {
            pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
            pc.onicecandidate = (e) => {
              if (e.candidate) {
                ws.send(JSON.stringify({
                  type: "signal",
                  target: TARGET,
                  payload: { kind: "ice-candidate", candidate: e.candidate.toJSON() },
                }));
              }
            };
            pc.ontrack = (e) => {
              log("received remote track:", e.track.kind);
              document.getElementById("remote").srcObject = e.streams[0];
            };
            // Must be created before the offer so it's negotiated in the SDP.
            inputChannel = pc.createDataChannel("input");
            inputChannel.onopen = () => log("input data channel open");
            const offer = await pc.createOffer({ offerToReceiveVideo: true });
            await pc.setLocalDescription(offer);
            ws.send(JSON.stringify({
              type: "signal",
              target: TARGET,
              payload: { kind: "offer", sdp: offer.sdp },
            }));
            log("sent offer to", TARGET);
          }

          if (msg.type === "signal") {
            const payload = msg.payload;
            if (payload.kind === "answer") {
              await pc.setRemoteDescription({ type: "answer", sdp: payload.sdp });
              log("applied remote answer");
            } else if (payload.kind === "ice-candidate") {
              await pc.addIceCandidate(payload.candidate);
            }
          }
        };

        ws.onerror = (e) => log("ws error", e.message || e);
        ws.onclose = () => log("ws closed");
      });
    </script>
  </body>
</html>
